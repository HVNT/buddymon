name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # The general test job can use any supported 3.12 patch. The
          # release-runtime job below verifies the exact locked interpreter.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python3 -m pip install --requirement requirements-test.txt

      - name: Validate scripts and metadata
        run: |
          bash -n scripts/*.sh
          python3 -m json.tool .claude-plugin/plugin.json >/dev/null
          python3 -m json.tool .claude-plugin/marketplace.json >/dev/null
          python3 -m json.tool hooks.json >/dev/null
          python3 scripts/validate-release-metadata.py

      - name: Check committed whitespace
        env:
          EVENT_NAME: "${{ github.event_name }}"
          BASE_SHA: "${{ github.event.pull_request.base.sha }}"
          BEFORE_SHA: "${{ github.event.before }}"
          HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: |
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            git diff --check "${BASE_SHA}...${HEAD_SHA}"
          elif [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
            git diff-tree --check --root --no-commit-id -r "${HEAD_SHA}"
          else
            git diff --check "${BEFORE_SHA}..${HEAD_SHA}"
          fi

      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m pytest tests/ -q -p no:cacheprovider

      - name: Build native development app
        run: scripts/build-macos-app.sh

      - name: Validate native bundle metadata
        run: |
          plutil -lint .build/macos/BuddyMon.app/Contents/Info.plist
          python3 scripts/validate-release-metadata.py --app .build/macos/BuddyMon.app

  release-runtime:
    name: Verify locked self-contained app
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate release inputs
        run: python3 scripts/validate-release-metadata.py

      - name: Build and verify locked runtime
        run: |
          scripts/build-python-runtime.sh --runtime-dir .build/ci-python-runtime
          python3 scripts/verify-python-runtime.py .build/ci-python-runtime

      - name: Build and verify self-contained app
        run: |
          scripts/build-macos-app.sh \
            --friend \
            --no-bootstrap-runtime \
            --runtime-dir .build/ci-python-runtime
          python3 scripts/verify-python-runtime.py \
            .build/macos/BuddyMon.app/Contents/Resources/python
          python3 scripts/validate-release-metadata.py \
            --app .build/macos/BuddyMon.app \
            --bundle-id com.hvnt.buddymon
